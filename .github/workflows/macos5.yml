name: macOS arm64 networking (scratch)

on:
  workflow_dispatch:

concurrency:
  group: macos-net
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 350
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: mac-ccache-${{ github.run_id }}
          restore-keys: |
            mac-ccache-
      - name: Tools
        run: |
          brew install ninja ccache || true
          cmake --version; ninja --version; clang --version | head -1; sysctl -n hw.ncpu
      - name: Configure
        run: |
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_ASSERTIONS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_DOCS=OFF -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_ENABLE_ARCMT=OFF -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1 -DLLVM_TOOL_LTO_BUILD=OFF \
            -DLIBCXX_INCLUDE_TESTS=OFF -DLIBCXX_INCLUDE_BENCHMARKS=OFF -DLIBCXX_INSTALL_MODULES=ON \
            -DLIBCXXABI_INCLUDE_TESTS=OFF -DLIBCXXABI_USE_LLVM_UNWINDER=OFF
      - name: Build clang and lld
        run: ninja -C build clang lld
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: mac-ccache-${{ github.run_id }}
      - name: List targets that exist
        run: ninja -C build -t targets all | grep -E '^(runtimes|install-runtimes|install|install-cxx|install-cxxabi|install-cxx-modules|install-clang|install-lld)[:]' || true
      - name: Build runtimes
        run: ninja -C build -k 0 runtimes
      - name: Install
        run: ninja -C build install
      - name: Show install
        run: |
          ls install/bin | head -20; ls install/include/c++/v1 | head -5; ls install/lib | head -20
          find install -name 'libc++.modules.json' -o -name 'std.cppm' | head
      - name: Networking tests (experimental, kqueue)
        run: |
          P="$PWD/install"
          scratch-examples/run_net_tests.sh "$P" 2>&1 | tee net-tests.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net-test-logs
          path: |
            net-tests.log
            /tmp/nettests/*.log
