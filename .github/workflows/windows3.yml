name: Windows x64 (scratch, persistent)

on:
  workflow_dispatch:

permissions:
  contents: read

# a newer run of this workflow replaces an older one that is still going
concurrency:
  group: windows-scratch
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (compiler cache, then libc++)
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: ilammy/msvc-dev-cmd@v1

      # layer 1: the finished compiler. Its key is the content of the compiler sources, so a change to the libc++
      # sources (the case being worked on) finds it and skips the 90 minute build altogether.
      - name: Restore the finished compiler
        id: compiler
        uses: actions/cache/restore@v4
        with:
          path: install
          key: win-compiler-${{ hashFiles('clang/include/**', 'clang/lib/**', 'clang/tools/**', 'clang/utils/**', 'llvm/include/**', 'llvm/lib/**', 'llvm/tools/**', 'lld/**', 'cmake/**', 'CMakeLists.txt') }}

      # layer 2: ccache, restored from the newest earlier cache when the compiler sources did change, so that only the
      # files that changed are compiled again.
      - name: Restore ccache
        if: steps.compiler.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: win-ccache-${{ github.run_id }}
          restore-keys: |
            win-ccache-

      - name: Tools
        run: |
          choco install ccache -y --no-progress >/dev/null || true
          cmake --version; ninja --version || choco install ninja -y; cl 2>&1 | head -1; ccache --version | head -1; nproc

      - name: Configure the compiler
        id: configure
        if: steps.compiler.outputs.cache-hit != 'true'
        run: |
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DLLVM_ENABLE_ASSERTIONS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_DOCS=OFF -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_ENABLE_ARCMT=OFF -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=2
      - name: Build the compiler
        id: build
        if: steps.compiler.outputs.cache-hit != 'true'
        run: cmake --build build --target clang lld -- -k 0
      - name: Install the compiler
        id: install
        if: steps.compiler.outputs.cache-hit != 'true'
        run: cmake --build build --target install-clang install-clang-resource-headers install-lld

      # saved as soon as it exists, not at the end of the job, so that it survives whatever the libc++ stage does
      - name: Save the finished compiler
        if: steps.compiler.outputs.cache-hit != 'true' && steps.install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: install
          key: win-compiler-${{ hashFiles('clang/include/**', 'clang/lib/**', 'clang/tools/**', 'clang/utils/**', 'llvm/include/**', 'llvm/lib/**', 'llvm/tools/**', 'lld/**', 'cmake/**', 'CMakeLists.txt') }}
      - name: Save ccache
        if: always() && steps.compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: win-ccache-${{ github.run_id }}

      - name: The compiler is usable
        run: |
          ls install/bin | head
          install/bin/clang-cl.exe --version

      - name: Build libc++ with the new compiler
        id: runtimes
        continue-on-error: true
        run: |
          P="$PWD/install"
          cmake -S runtimes -B build-rt -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$P" \
            -DCMAKE_C_COMPILER="$P/bin/clang-cl.exe" -DCMAKE_CXX_COMPILER="$P/bin/clang-cl.exe" \
            -DCMAKE_LINKER="$P/bin/lld-link.exe" \
            -DLLVM_ENABLE_RUNTIMES="libcxx" -DLIBCXX_ENABLE_SHARED=OFF \
            -DLIBCXX_INCLUDE_TESTS=OFF -DLIBCXX_INCLUDE_BENCHMARKS=OFF -DLIBCXX_INSTALL_MODULES=ON
          mkdir -p diag
          set +e
          cmake --build build-rt --target install-cxx install-cxx-modules -- -k 0 > diag/libcxx-build.log 2>&1
          rc=$?
          set -e
          grep -E 'FAILED:|error:' diag/libcxx-build.log | head -80 || true
          exit $rc
      - name: Preprocessed output of the failing files
        if: always()
        run: |
          mkdir -p diag
          for obj in libcxx/src/CMakeFiles/cxx_static.dir/charconv.cpp.obj libcxx/src/CMakeFiles/cxx_static.dir/contracts.cpp.obj; do
            cmd=$(ninja -C build-rt -t commands "$obj" 2>/dev/null | tail -1) || true
            [ -n "$cmd" ] || continue
            echo "$cmd" > "diag/$(basename $obj).cmd"
            pp=$(echo "$cmd" | sed -E 's# /c # /E #; s#/Fo[^ ]+##; s#-Fo[^ ]+##')
            (cd build-rt && eval "$pp" > "../diag/$(basename $obj).i" 2> "../diag/$(basename $obj).i.err") || true
          done
          grep -n '__valid' diag/charconv.cpp.obj.i | head -20 || true
          ls -la diag
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-libcxx-diagnostics
          path: diag
      - name: Examples
        id: examples
        if: steps.runtimes.outcome == 'success'
        continue-on-error: true
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          P="$(cygpath -m "$PWD/install")"; cd scratch-examples; fail=0
          for f in hello reflect expansion contracts execution simd constexpr_exception constexpr_math text_encoding_env; do
            echo "== $f"
            if "$P/bin/clang-cl.exe" -clang:-std=c++26 -MD -EHsc -fuse-ld=lld -Xclang -nostdinc++ -I "$P/include/c++/v1" \
                 $f.cpp -Fe:$f.exe -link "$P/lib/libc++.lib" msvcprt.lib && ./$f.exe; then echo "PASS $f"; else echo "FAIL $f"; fail=1; fi
          done
          exit $fail
      - name: exception_ptr in two language modes
        id: modes
        if: steps.runtimes.outcome == 'success'
        continue-on-error: true
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          P="$(cygpath -m "$PWD/install")"; cd scratch-examples; fail=0
          CL="$P/bin/clang-cl.exe"
          echo "== exc23 (C++23 client)"
          "$CL" -clang:-std=c++23 -MD -EHsc -fuse-ld=lld -Xclang -nostdinc++ -I "$P/include/c++/v1" exc23.cpp -Fe:exc23.exe -link "$P/lib/libc++.lib" msvcprt.lib && ./exc23.exe || fail=1
          echo "== mixed (C++26 and C++23 translation units)"
          "$CL" -clang:-std=c++26 -MD -EHsc -Xclang -nostdinc++ -I "$P/include/c++/v1" -c tu26.cpp -Fo:tu26.obj \
            && "$CL" -clang:-std=c++23 -MD -EHsc -fuse-ld=lld -Xclang -nostdinc++ -I "$P/include/c++/v1" tu23.cpp tu26.obj -Fe:mixed.exe -link "$P/lib/libc++.lib" msvcprt.lib && ./mixed.exe || fail=1
          exit $fail
      - name: Probe the constexpr exception_ptr gate
        if: steps.runtimes.outcome == 'success'
        continue-on-error: true
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          P="$(cygpath -m "$PWD/install")"; cd scratch-examples
          "$P/bin/clang-cl.exe" -clang:-std=c++26 -MD -EHsc -fuse-ld=lld -Xclang -nostdinc++ -I "$P/include/c++/v1" probe_macros.cpp -Fe:probe.exe -link "$P/lib/libc++.lib" msvcprt.lib && ./probe.exe
      - name: Duplicate definitions between the headers and libc++.lib
        if: steps.runtimes.outcome == 'success'
        continue-on-error: true
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          P="$(cygpath -m "$PWD/install")"; cd scratch-examples; mkdir -p dupobj
          # every header in a translation unit of its own, with every inline function emitted (-femit-all-decls), then all of
          # them against the whole libc++.lib: a symbol that the headers define inline and the library defines out of line
          # is a duplicate for the linker of COFF
          CL="$P/bin/clang-cl.exe"; failed=0
          for h in $(cat headers.txt); do
            printf '#include <%s>\n' "$h" > "dup_$h.cpp"
            "$CL" -clang:-std=c++26 -MD -EHsc -Xclang -nostdinc++ -I "$P/include/c++/v1" -Xclang -femit-all-decls -c "dup_$h.cpp" -Fo:"dupobj/$h.obj" > "dup_$h.log" 2>&1 || { echo "does not compile: $h"; grep -m2 "error" "dup_$h.log"; failed=$((failed+1)); }
          done
          echo "compiled $(ls dupobj | wc -l) of $(wc -l < headers.txt) headers, $failed failed"
          printf 'int main() {}\n' > dup_main.cpp
          "$CL" -clang:-std=c++26 -MD -EHsc -Xclang -nostdinc++ -I "$P/include/c++/v1" -c dup_main.cpp -Fo:dupobj/main.obj
          "$CL" -fuse-ld=lld dupobj/*.obj -Fe:dup.exe -link -wholearchive:"$P/lib/libc++.lib" msvcprt.lib -errorlimit:0 > dup_link.log 2>&1 || true
          echo "link: $(grep -c 'duplicate symbol' dup_link.log) duplicate symbols"
          grep "duplicate symbol" dup_link.log | sed 's/lld-link: error: duplicate symbol: //' | sort -u | head -300
          grep -E "error" dup_link.log | grep -v "duplicate symbol" | head -10 || true
      - name: Summary
        if: always()
        run: |
          {
            echo "### Windows x64"
            echo "- compiler cache hit: ${{ steps.compiler.outputs.cache-hit }}"
            echo "- libc++ build: ${{ steps.runtimes.outcome }}"
            echo "- examples: ${{ steps.examples.outcome }}"
            echo "- exception_ptr modes: ${{ steps.modes.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
